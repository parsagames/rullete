name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_B64 secret is empty or missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" \
            | sed '/-----BEGIN [^-]*-----/d;/-----END [^-]*-----/d' \
            | tr -d '\r\n[:space:]' \
            | base64 --decode > release-key.jks
          test -s release-key.jks || { echo "ERROR: release-key.jks was not created."; exit 1; }

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle :app:assembleRelease \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/release-key.jks" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-release-apk
          path: app/build/outputs/apk/release/*.apk
